function newFolder(){const n=(prompt('Nama folder baru:')||'').trim().slice(0,40);if(!n)return;if(F.some(x=>!x[2]&&x[0].toLowerCase()==n.toLowerCase()))return toast('Nama folder sudah ada');const sb=(prompt('Subfolder (pisahkan dengan koma). Kosongkan jika tanpa subfolder:')||'').split(',').map(t=>t.trim().slice(0,40)).filter(Boolean);F.push(sb.length?[n,[...new Set(sb)]]:[n]);saveCF();toast('Folder dibuat');render()}
const nz=t=>t.toLowerCase().replace(/\.[a-z0-9]{1,5}$/,'').replace(/[^a-z0-9]/g,'');
function guess(fn){const n=nz(fn);let best=null,sc=0;const subHits=[];
 F.forEach((x,i)=>{if(x[2])return;const a=nz(x[0]),subs=x[1]||[];let hit=-1,hl=0;subs.forEach((q,j)=>{const b=nz(q);if(b.length>=2&&n.includes(b)){subHits.push([i,j,b.length]);if(b.length>hl){hit=j;hl=b.length}}});
  if(a&&n.includes(a)&&(!subs.length||hit>=0)){const v=a.length*2+hl;if(v>sc){sc=v;best=i+':'+(subs.length?hit:-1)}}});
 if(!best&&subHits.length){const m=Math.max(...subHits.map(h=>h[2])),t=subHits.filter(h=>h[2]==m);if(t.length==1)best=t[0][0]+':'+t[0][1]}
 return best}

function login(m){m.innerHTML=`<div class="card" style="text-align:center;margin-top:20px"><img class="lg" src="${LOGO}" style="height:90px;margin:0 auto 10px"><h3 style="margin:0">Masuk Aplikasi K3</h3><p class="mu">Gunakan email Google (Drive) yang terdaftar di HP ini. Tidak perlu akun Claude.</p><input id="em" type="email" inputmode="email" autocomplete="email" placeholder="nama@gmail.com"><button class="btn" id="mk">Masuk</button></div>`+DEVF;$('#mk').onclick=()=>{const v=$('#em').value.trim().toLowerCase();if(!/^[^@\s<>&"']+@[^@\s<>&"']+\.[^@\s<>&"']+$/.test(v))return toast('Format email tidak valid');ME=v;try{localStorage.setItem('k3me',v)}catch(e){}render()}}

function open(){return new Promise((ok,no)=>{const r=indexedDB.open('k3bpa',1);r.onupgradeneeded=()=>r.result.createObjectStore('r',{keyPath:'id',autoIncrement:true});r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}
const tx=(m,fn)=>new Promise((ok,no)=>{const t=db.transaction('r',m),o=fn(t.objectStore('r'));t.oncomplete=()=>ok(o&&o.result);t.onerror=()=>no(t.error)});

const th=(b,w)=>new Promise(ok=>{if(b.type.startsWith('video'))return thv(b,w).then(ok);if(b.type&&!b.type.startsWith('image'))return ok(null);const i=new Image,u=URL.createObjectURL(b);i.onload=()=>{const k=w/Math.max(i.width,i.height),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);URL.revokeObjectURL(u);ok(c)};i.onerror=()=>ok(null);i.src=u});
